name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build portable package
        run: |
          mkdir -p package/disk package/iso package/images package/ssh
          touch package/disk/.gitkeep package/iso/.gitkeep package/images/.gitkeep package/ssh/.gitkeep
          cp start.bat boot-iso.bat start-custom.bat init.bat README.md package/
          cp -r scripts package/
          cd package
          zip -r ../portable-linux.zip .
          cd ..

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="latest"
          fi

          echo "Target Release Tag: ${TAG_NAME}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} exists. Uploading new assets..."
            gh release upload "${TAG_NAME}" portable-linux.zip setup.bat --clobber
            gh release edit "${TAG_NAME}" --notes "Automated release build from commit ${GITHUB_SHA}"
          else
            echo "Release ${TAG_NAME} does not exist. Creating new release..."
            gh release create "${TAG_NAME}" portable-linux.zip setup.bat \
              --title "${TAG_NAME}" \
              --notes "Automated release build from commit ${GITHUB_SHA}"
          fi
